# nginx server for the @pos/web admin portal's Next static export (out/).
# Installed at /etc/nginx/conf.d/default.conf in the `web` image (see Dockerfile),
# replacing nginx:alpine's stock server block. Listens on :80; the container is
# published as :80 in prod (docker-compose.prod.yml) and :3000->:80 in dev.
server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Next static export emits FLAT files: /admin/inventory -> admin/inventory.html.
  # Try the exact file, then <path>.html, then a directory index, then fall back to
  # the SPA entry so client-side routing (and hard refreshes on deep links) resolve.
  location / {
    try_files $uri $uri.html $uri/ /index.html;
  }

  # Content-hashed build assets are immutable — cache them aggressively.
  location /_next/static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
