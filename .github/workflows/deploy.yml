# Build the two production images, push them to GHCR, and deploy them to the
# DigitalOcean droplet over SSH. See DEPLOY.md for the one-time secrets/variables
# and droplet .env this workflow depends on.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag (commit SHA) to (re)deploy for rollback. Leave blank to build & deploy this commit."
        required: false
        type: string

# Cancel an in-flight deploy if a newer commit lands — we only want the latest live.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # GHCR requires a lowercase owner; github.repository_owner may be mixed-case.
  REGISTRY: ghcr.io

jobs:
  # -------------------------------------------------------------------------
  # Build & push both images. Skipped on a workflow_dispatch rollback that names
  # an existing image_tag (nothing to build — we just redeploy that tag).
  # -------------------------------------------------------------------------
  build-and-push:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.image_tag == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase the image owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- API image (also runs the one-shot migrate service) -----------------
      - name: Build & push pos-api
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/pos-api:latest
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/pos-api:${{ github.sha }}
          cache-from: type=gha,scope=pos-api
          cache-to: type=gha,scope=pos-api,mode=max

      # --- Web image (nginx + static export; NEXT_PUBLIC_* baked in here) ------
      - name: Build & push pos-web
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/pos-web:latest
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/pos-web:${{ github.sha }}
          cache-from: type=gha,scope=pos-web
          cache-to: type=gha,scope=pos-web,mode=max

  # -------------------------------------------------------------------------
  # Ship the compose file to the droplet and roll the stack over to the new tag.
  # Runs even on a rollback dispatch (build-and-push skipped) via always() + a
  # guard that the build job didn't fail.
  # -------------------------------------------------------------------------
  deploy:
    needs: build-and-push
    if: ${{ always() && needs.build-and-push.result != 'failure' && needs.build-and-push.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag to deploy
        id: tag
        # Rollback dispatch → the supplied tag; normal run → this commit's SHA.
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "value=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy compose file to the droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: docker-compose.prod.yml
          target: /opt/pos

      - name: Pull & roll over the stack
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          # envs= forwards these into the remote shell (appleboy reads them from the runner env).
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd /opt/pos
            # /opt/pos/.env (never in git) supplies GHCR_OWNER + all runtime secrets.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            docker logout ghcr.io
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

      - name: Post-deploy smoke check
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            # Give the api healthcheck a moment after the rollover, then probe both faces.
            for i in $(seq 1 20); do
              if curl -fsS http://localhost:4000/api/health >/dev/null; then break; fi
              echo "waiting for api ($i)…"; sleep 3
            done
            curl -fsS http://localhost:4000/api/health >/dev/null && echo "api OK"
            curl -fsS http://localhost/ >/dev/null && echo "web OK"
