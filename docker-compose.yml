# ---------------------------------------------------------------------------
# Hospitality POS — one-command local stack: db + api + web (+ one-shot migrate).
#
#     cp .env.example .env      # first time only — secrets live here, not below
#     docker compose up -d --build
#
#   App:  http://localhost:3000       (sign in: admin / pos1234 after first-run seed)
#   API:  http://localhost:4000/api/health
#   DB browser (optional): docker compose --profile tools up -d adminer  -> :8080
#
# Printing is handled by the Electron till app (apps/till), which folds the print
# host into its main process and drives the Windows printer drivers directly — the
# standalone apps/print-agent is retired. The till authenticates to the API with
# PRINT_AGENT_TOKEN, so the value here (read from .env) MUST match the till's token
# (dev: the repo .env loaded by `pnpm till`; packaged: the till.env beside the exe).
#
# Secrets are NOT hardcoded in this file: the api/migrate services read them from
# the root .env via `env_file`, and the few values that appear inline are pulled in
# with `${VAR}` interpolation (Compose reads .env automatically). Copy .env.example
# to .env and edit it — for a real deployment change the JWT secrets and
# PRINT_AGENT_TOKEN there.
# ---------------------------------------------------------------------------

# One image (hospitality-pos:local) shared by api, web and migrate. ALL three
# declare the same build so a fresh machine BUILDS the image (no registry pull
# attempt); compose/bake dedups the identical build into a single pass. The
# external dockerfile "# syntax" frontend that once crashed the build has been
# removed from the Dockerfile, so sharing the build across services is safe.
x-app: &app
  image: hospitality-pos:local
  build:
    context: .
    args:
      # Inlined into the web bundle at build time; the browser runs on the host.
      # Read from .env (interpolation), with a dev default so a bare checkout builds.
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:4000}"
      NEXT_PUBLIC_WS_URL: "${NEXT_PUBLIC_WS_URL:-http://localhost:4000}"

# In-container DB URL: reach Postgres by its compose service name. This is
# intentionally NOT taken from .env — .env's DATABASE_URL targets the host
# (127.0.0.1:5433) for native tools, but inside the compose network it's db:5432.
# The credentials still come from .env (or the shell) via interpolation.
x-db-url: &db-url "postgresql://${POSTGRES_USER:-pos}:${POSTGRES_PASSWORD:-pos}@db:5432/${POSTGRES_DB:-pos}?schema=public"

services:
  db:
    image: postgres:15-alpine
    container_name: pos-db
    restart: always
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-pos}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-pos}"
      POSTGRES_DB: "${POSTGRES_DB:-pos}"
    ports:
      # Host 5433 (not 5432) to avoid clashing with a native Postgres install.
      - "5433:5432"
    volumes:
      - pos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pos} -d ${POSTGRES_DB:-pos}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot: apply migrations, then seed demo data ONLY on an empty DB (the guard
  # makes re-runs a no-op, so restarts never wipe live data). Runs on every `up`
  # and must exit 0 before the api starts.
  migrate:
    <<: *app
    container_name: pos-migrate
    command: >
      sh -lc "pnpm --filter @pos/db exec prisma migrate deploy &&
              node packages/db/scripts/seed-if-empty.mjs"
    env_file:
      - .env
    environment:
      # Override .env's host-facing DATABASE_URL with the in-network one.
      DATABASE_URL: *db-url
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    container_name: pos-api
    command: node apps/api/dist/main.js
    # Secrets & config (JWT_*, PRINT_AGENT_TOKEN, CORS_ORIGIN, API_PORT,
    # CURRENCY_SYMBOL, ...) come straight from the root .env — none are inlined here.
    env_file:
      - .env
    environment:
      # The only override: swap .env's host DATABASE_URL for the compose-network one.
      DATABASE_URL: *db-url
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # node's http.get — bookworm-slim has neither curl nor wget, but always node.
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4000/api/health',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: always

  web:
    <<: *app
    container_name: pos-web
    # Admin-only Web Management Portal. The operational POS/Rooms UI now lives in
    # the Electron till (apps/till/ui), so this app dropped `output: 'export'`
    # and is served normally by `next start`.
    command: pnpm --filter @pos/web start
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: always

  # Optional DB browser — only starts with the `tools` profile:
  #   docker compose --profile tools up -d adminer
  adminer:
    image: adminer:latest
    container_name: pos-adminer
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pos_pgdata:
