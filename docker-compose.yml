# ---------------------------------------------------------------------------
# Hospitality POS — one-command local stack: db + api + web (+ one-shot migrate).
#
#     docker compose up -d --build
#
#   App:  http://localhost:3000       (sign in: admin / pos1234 after first-run seed)
#   API:  http://localhost:4000/api/health
#   DB browser (optional): docker compose --profile tools up -d adminer  -> :8080
#
# The print-agent is NOT in this stack — it runs natively on the Windows till so it
# can drive the USB receipt printer via the OS spooler (network KOT printers too).
# See scripts/install-print-agent.ps1 and DEPLOY.md.
#
# The secrets below are the dev defaults from .env.example. For a real deployment
# CHANGE the JWT secrets and PRINT_AGENT_TOKEN. PRINT_AGENT_TOKEN must MATCH the
# value in the till's root .env that the print-agent reads.
# ---------------------------------------------------------------------------

# One image (hospitality-pos:local) shared by api, web and migrate. ALL three
# declare the same build so a fresh machine BUILDS the image (no registry pull
# attempt); compose/bake dedups the identical build into a single pass. The
# external dockerfile "# syntax" frontend that once crashed the build has been
# removed from the Dockerfile, so sharing the build across services is safe.
x-app: &app
  image: hospitality-pos:local
  build:
    context: .
    args:
      # Inlined into the web bundle at build time; the browser runs on the host.
      NEXT_PUBLIC_API_URL: "http://localhost:4000"
      NEXT_PUBLIC_WS_URL: "http://localhost:4000"

# In-container DB URL: reach Postgres by its compose service name. The host's
# 5433:5432 mapping is host-only; inside the compose network the port is 5432.
x-db-url: &db-url "postgresql://pos:pos@db:5432/pos?schema=public"

services:
  db:
    image: postgres:15-alpine
    container_name: pos-db
    restart: always
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos
      POSTGRES_DB: pos
    ports:
      # Host 5433 (not 5432) to avoid clashing with a native Postgres install.
      - "5433:5432"
    volumes:
      - pos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d pos"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot: apply migrations, then seed demo data ONLY on an empty DB (the guard
  # makes re-runs a no-op, so restarts never wipe live data). Runs on every `up`
  # and must exit 0 before the api starts.
  migrate:
    <<: *app
    container_name: pos-migrate
    command: >
      sh -lc "pnpm --filter @pos/db exec prisma migrate deploy &&
              node packages/db/scripts/seed-if-empty.mjs"
    environment:
      DATABASE_URL: *db-url
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    container_name: pos-api
    command: node apps/api/dist/main.js
    environment:
      DATABASE_URL: *db-url
      API_PORT: "4000"
      CORS_ORIGIN: "http://localhost:3000"
      JWT_ACCESS_SECRET: "dev-access-secret-change-me"
      JWT_REFRESH_SECRET: "dev-refresh-secret-change-me"
      JWT_ACCESS_TTL: "15m"
      JWT_REFRESH_TTL: "7d"
      PRINT_AGENT_TOKEN: "dev-print-agent-token-change-me"
      CURRENCY_SYMBOL: "₨"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # node's http.get — bookworm-slim has neither curl nor wget, but always node.
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4000/api/health',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: always

  web:
    <<: *app
    container_name: pos-web
    command: pnpm --filter @pos/web exec next start -p 3000 -H 0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: always

  # Optional DB browser — only starts with the `tools` profile:
  #   docker compose --profile tools up -d adminer
  adminer:
    image: adminer:latest
    container_name: pos-adminer
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pos_pgdata:
