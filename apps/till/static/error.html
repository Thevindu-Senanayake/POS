<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>POS — can't reach services</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        user-select: none;
        -webkit-user-select: none;
      }
      .box { text-align: center; max-width: 460px; padding: 0 24px; }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 24px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #7f1d1d;
        color: #fecaca;
        font-size: 30px;
        font-weight: 700;
      }
      h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
      p { margin: 0 0 20px; color: #94a3b8; font-size: 14px; line-height: 1.5; }
      button {
        font: inherit;
        font-weight: 600;
        color: #0f172a;
        background: #38bdf8;
        border: 0;
        border-radius: 8px;
        padding: 10px 22px;
        cursor: pointer;
      }
      button:hover { background: #7dd3fc; }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="mark">!</div>
      <h1>Can't reach the POS services</h1>
      <p>
        The local server isn't responding yet. Make sure Docker Desktop is running
        and the stack has started, then try again.
      </p>
      <button id="retry" type="button">Retry</button>
    </div>
    <script>
      // window.till is exposed by preload.js (contextBridge).
      document.getElementById('retry').addEventListener('click', function () {
        if (window.till && window.till.retry) window.till.retry();
      });
    </script>
  </body>
</html>
